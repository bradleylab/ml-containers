name: Build geolg-3dfaultnet

on:
  push:
    paths:
      - 'geolg-3dfaultnet/**'
      - '!geolg-3dfaultnet/**/*.md'
      - '.github/workflows/build-geolg-3dfaultnet.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/geolg-3dfaultnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # The CUDA 12.8.1 cudnn-runtime base plus the cu128 torch wheel and its
        # nvidia-*-cu12 dependencies exceed the ~14 GB default free disk on
        # ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the GEOLG_REF commit pin lives in
      # geolg-3dfaultnet/Dockerfile so it is version-controlled and a re-run of
      # this workflow reproduces the committed build. Change the pin by editing
      # the ARG default.
      #
      # The build fetches no weights. The checkpoint is a GitHub Release asset
      # pulled at runtime by scripts/fetch_weights.sh, which verifies its
      # sha256; baking it would put a 68 MiB binary in every layer cache and
      # defeat that check.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: geolg-3dfaultnet
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.8-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
