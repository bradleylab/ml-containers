name: Build corrdiff

on:
  push:
    paths:
      - 'corrdiff/**'
      - '!corrdiff/**/*.md'
      - '.github/workflows/build-corrdiff.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/corrdiff

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # NATTEN arrives as a prebuilt wheel from SHI-Labs' own index, so nothing
    # here compiles CUTLASS. This used to be a 360-minute job written around
    # that compile; the wheel makes the natten layer a 370 MB download. If it
    # ever goes back to building from source, raise this again and read the
    # NATTEN_WHEEL comment in corrdiff/Dockerfile first — the arch variable
    # takes a dotted value (9.0), not 90.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # A -devel CUDA base (~6 GB) plus torch cu128 wheels plus a 370 MB
        # NATTEN wheel that unpacks to a much larger compiled extension push
        # well past the ~14 GB default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the earth2studio version, the NATTEN version and wheel
      # URL, and the physicsnemo commit pin all live in corrdiff/Dockerfile so
      # they are version-controlled and a re-run of this workflow reproduces
      # the committed build. Change a pin by editing the ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: corrdiff
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:e2s0.17-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
