name: Build dino-cv-stonewall

on:
  push:
    paths:
      - 'dino-cv-stonewall/**'
      - '!dino-cv-stonewall/**/*.md'
      - '.github/workflows/build-dino-cv-stonewall.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/dino-cv-stonewall

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The CUDA 12.1 torch wheels are several GB installed. No weights are in
      # the image.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the target is the Compute2 H100 nodes. The upstream commit
      # is pinned in the Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dino-cv-stonewall
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.5.1-cu121
          cache-from: type=gha
          cache-to: type=gha,mode=max
