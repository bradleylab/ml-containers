name: Build boltz

on:
  push:
    paths:
      - 'boltz/**'
      - '!boltz/**/*.md'
      - '.github/workflows/build-boltz.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/boltz

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # pytorch/pytorch 2.8.0-cuda12.9 base plus boltz's dependency tree
        # (rdkit, numba, scipy, lightning) and the cuEquivariance kernel
        # wheels push the image past the ~14 GB default free disk on
        # ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the BOLTZ_VERSION / CUEQ_VERSION / BASE_TORCH_VERSION
      # pins live in boltz/Dockerfile so they are version-controlled and a
      # re-run of this workflow reproduces the committed build. Change a pin
      # by editing the ARG default.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: boltz
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.8-cu129
          cache-from: type=gha
          cache-to: type=gha,mode=max
