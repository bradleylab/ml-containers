name: Build ntv3

on:
  push:
    paths:
      - 'ntv3/**'
      - '!ntv3/**/*.md'
      - '.github/workflows/build-ntv3.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/ntv3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # NGC PyTorch 25.04 base (~9 GB) pushes the image past the ~14 GB
        # default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No HF token is passed to this build, and none may be added. The NTv3
      # weights are gated but are NOT baked — they are staged at runtime from
      # a login node. The Dockerfile's smoke test fails the build if HF_TOKEN
      # or HUGGING_FACE_HUB_TOKEN is present, so a credential cannot reach
      # GHCR through this workflow.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ntv3
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.7-cu129
          cache-from: type=gha
          cache-to: type=gha,mode=max
