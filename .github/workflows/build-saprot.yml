name: Build saprot

on:
  push:
    paths:
      - 'saprot/**'
      - '!saprot/**/*.md'
      - '.github/workflows/build-saprot.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/saprot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # NGC PyTorch 25.04 base (~9 GB) alone exceeds the ~14 GB default
        # free disk on ubuntu-latest once a layer is written.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the FOLDSEEK_VERSION / SAPROT_REF pins live in
      # saprot/Dockerfile so they are version-controlled and a re-run of this
      # workflow reproduces the committed build. Change a pin by editing the
      # ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: saprot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.7-cu129
          cache-from: type=gha
          cache-to: type=gha,mode=max
