name: Build afwizard

on:
  push:
    paths:
      - 'afwizard/**'
      - '!afwizard/**/*.md'
      - '.github/workflows/build-afwizard.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/afwizard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, matching the rest of the repo and the Compute2 target.
      # No weights and no CUDA here, so this is one of the smaller images.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: afwizard
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py311
          cache-from: type=gha
          cache-to: type=gha,mode=max
