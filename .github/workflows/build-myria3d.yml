name: Build myria3d

on:
  push:
    paths:
      - 'myria3d/**'
      - '!myria3d/**/*.md'
      - '.github/workflows/build-myria3d.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/myria3d

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # torch cu124 wheels bundle their own CUDA runtime (~3 GB) and the
        # conda-forge PDAL + GDAL layer adds another ~1.5 GB, which crowds
        # the ~14 GB default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the MYRIA3D_REF commit pin lives in myria3d/Dockerfile
      # so it is version-controlled and a re-run of this workflow reproduces
      # the committed build. Change the pin by editing the ARG default.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: myria3d
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.4-cu124
          cache-from: type=gha
          cache-to: type=gha,mode=max
