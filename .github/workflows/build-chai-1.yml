name: Build chai-1

on:
  push:
    paths:
      - 'chai-1/**'
      - '!chai-1/**/*.md'
      - '.github/workflows/build-chai-1.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/chai-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # pytorch/pytorch 2.6.0-cuda12.6 base plus chai_lab's dependency tree
        # (rdkit, numba, and pandas with its aws/gcp/parquet extras) push the
        # image past the ~14 GB default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the CHAI_VERSION pin lives in chai-1/Dockerfile so it is
      # version-controlled and a re-run of this workflow reproduces the
      # committed build. Change the pin by editing the ARG default.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: chai-1
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.6-cu126
          cache-from: type=gha
          cache-to: type=gha,mode=max
