name: Build satclip

on:
  push:
    paths:
      - 'satclip/**'
      - '!satclip/**/*.md'
      - '.github/workflows/build-satclip.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/satclip

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The CUDA 13.0 torch wheel, triton and the nvidia-* libraries are about
      # 3 GB as wheels and larger installed; the six checkpoints add 0.6 GB.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the target is the Compute2 H100 nodes, and the CUDA wheel
      # set is resolved for x86-64.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: satclip
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.14-cu130
          cache-from: type=gha
          cache-to: type=gha,mode=max
