name: Build esm

on:
  push:
    paths:
      - 'esm/**'
      - '!esm/**/*.md'
      - '.github/workflows/build-esm.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/esm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # NGC PyTorch 25.04 base (~9 GB) plus esm's dependency tree (rdkit,
        # biotite, accelerate, boto3, ...) push the image past the ~14 GB
        # default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the ESM_REF / ESM_TRANSFORMERS_REF commit pins live in
      # esm/Dockerfile so they are version-controlled and a re-run of this
      # workflow reproduces the committed build. Change the pin by editing the
      # ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: esm
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu128-py312
          cache-from: type=gha
          cache-to: type=gha,mode=max
