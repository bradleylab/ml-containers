name: Build n2n4m

on:
  push:
    paths:
      - 'n2n4m/**'
      - '!n2n4m/**/*.md'
      - '.github/workflows/build-n2n4m.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/n2n4m

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # The cu128 torch wheel pulls its CUDA runtime in as nvidia-* pip
        # packages, which is the bulk of this image. Comfortably under the
        # runner's default free space, but the buildx cache is not.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the N2N4M_REF / CRISM_ML_REF commit pins live in
      # n2n4m/Dockerfile so they are version-controlled and a re-run of this
      # workflow reproduces the committed build. Change a pin by editing the
      # ARG defaults. The build's own smoke test asserts the installed SHAs
      # match, so a drifted pin fails the build rather than shipping.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: n2n4m
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.9-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
