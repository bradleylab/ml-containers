name: Build fraxtex

on:
  push:
    paths:
      - 'fraxtex/**'
      - '!fraxtex/**/*.md'
      - '.github/workflows/build-fraxtex.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/fraxtex

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # onnxruntime-gpu and its nvidia-* wheels (cuDNN, cuBLAS, cuFFT, ...) are
      # about 2 GB to download and more unpacked, before the 470 MB of weights.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the target is the Compute2 H100 nodes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fraxtex
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ort1.26-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
