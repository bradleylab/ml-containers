name: Build stormcast

on:
  push:
    paths:
      - 'stormcast/**'
      - '!stormcast/**/*.md'
      - '.github/workflows/build-stormcast.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/stormcast

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # A -devel CUDA base (~6 GB) plus torch cu128 wheels plus
        # earth2studio's data stack push the image past the ~14 GB default
        # free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the earth2studio, torch and physicsnemo pins live in
      # stormcast/Dockerfile so they are version-controlled and a re-run of
      # this workflow reproduces the committed build. Change a pin by editing
      # the ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: stormcast
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:e2s0.17-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
