name: Build seist

on:
  push:
    paths:
      - 'seist/**'
      - '!seist/**/*.md'
      - '.github/workflows/build-seist.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/seist

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the SEIST_GIT_SHA upstream pin lives in seist/Dockerfile
      # so it is version-controlled and a re-run of this workflow reproduces the
      # committed build. Change the pin by editing the ARG default. The pinned
      # checkout carries the 18 pretrained checkpoints (29.3 MB), which the
      # build-time smoke test asserts are present — no weights are fetched.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: seist
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.5-cu121
          cache-from: type=gha
          cache-to: type=gha,mode=max
