name: Build aifs

on:
  push:
    paths:
      - 'aifs/**'
      - '!aifs/**/*.md'
      - '.github/workflows/build-aifs.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/aifs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # CUDA 12.6 runtime base (~3 GB) plus torch 2.7.0 and its bundled
        # nvidia-* CUDA libraries (~4 GB) plus the 114 MB flash-attn wheel,
        # which unpacks to a much larger compiled extension. That clears the
        # ~14 GB default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the FLASH_ATTN_WHEEL pin lives in aifs/Dockerfile so it
      # is version-controlled and a re-run of this workflow reproduces the
      # committed build. Change the pin by editing the ARG default.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: aifs
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu126-py312
          cache-from: type=gha
          cache-to: type=gha,mode=max
