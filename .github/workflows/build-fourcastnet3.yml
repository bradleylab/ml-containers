name: Build fourcastnet3

on:
  push:
    paths:
      - 'fourcastnet3/**'
      - '!fourcastnet3/**/*.md'
      - '.github/workflows/build-fourcastnet3.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/fourcastnet3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # torch-harmonics compiles its DISCO CUDA kernels from source in this
    # image. sm_90 only, so it is not the multi-hour build that corrdiff's
    # NATTEN layer is, but it is well past a pure-wheel install.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        # A -devel CUDA base (~6 GB) plus torch cu128 wheels plus makani's
        # dependency tree (numba, wandb, moviepy, physicsnemo) pushes the
        # image past the ~14 GB default free disk on ubuntu-latest.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the earth2studio version and the torch-harmonics /
      # makani commit pins live in fourcastnet3/Dockerfile so they are
      # version-controlled and a re-run of this workflow reproduces the
      # committed build. Change a pin by editing the ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fourcastnet3
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:e2s0.17-cu128
          cache-from: type=gha
          cache-to: type=gha,mode=max
