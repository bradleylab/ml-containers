name: Build adaf

on:
  push:
    paths:
      - 'adaf/**'
      - '!adaf/**/*.md'
      - '.github/workflows/build-adaf.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/adaf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 5.52 GB of weights on top of a conda + torch + GDAL stack. This step is
      # not optional here — the default runner does not have room.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the torch cu121 wheels are x86-64, and the target is the
      # Compute2 H100 nodes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: adaf
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.5-cu121-py39
          cache-from: type=gha
          cache-to: type=gha,mode=max
