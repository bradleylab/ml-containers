name: Build clean

on:
  push:
    paths:
      - 'clean/**'
      - '!clean/**/*.md'
      - '.github/workflows/build-clean.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bradleylab/clean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the CLEAN_GIT_SHA / ESM_GIT_SHA / TORCH_VERSION /
      # FAIR_ESM_VERSION pins live in clean/Dockerfile so they are
      # version-controlled and a re-run of this workflow reproduces the
      # committed build. Change a pin by editing the ARG defaults.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: clean
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:torch2.5-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
