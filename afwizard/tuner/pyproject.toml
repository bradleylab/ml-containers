[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afwizard-tuner"
version = "0.1.0"
description = "Objective-driven parameter search for ground filtering, scored on a classified point cloud; drives PDAL, hands winners to AFwizard for provenance"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "rasterio", "pyyaml", "shapely", "pyproj"]

[project.scripts]
afwizard-tune = "afwizard_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
